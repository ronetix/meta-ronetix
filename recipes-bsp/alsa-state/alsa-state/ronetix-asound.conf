# Default ALSA card of the Ronetix i.MX9 SoMs.
#
# This is meta-freescale's asound.conf of the NXP BSP,
# recipes-bsp/alsa-state/alsa-state/imx-nxp-bsp/asound.conf, with the
# sound card addressed by name instead of by index:
#
#   sed -e 's/"hw:0,0"/"hw:wm8962audio,0"/g' \
#       -e 's/^card 0$/card wm8962audio/' imx-nxp-bsp/asound.conf
#
# The boards register two sound cards: the WM8962 codec and the Bluetooth
# SCO link of the AP6275S (sound-bt-sco in the device tree, a PCM to the
# Bluetooth controller with no mixer at all). ALSA numbers cards in
# registration order, and the bt-sco card comes up first:
#
#   0 [btscoaudio ]: simple-card   - bt-sco-audio
#   1 [wm8962audio]: fsl-asoc-card - wm8962-audio
#
# So card 0, which is what the file above hardcodes everywhere, is the
# Bluetooth link. Anything that just opens "default" - aplay without -D,
# amixer without -c, most applications - then talks to a card with no
# outputs and no controls:
#
#   $ amixer info
#   Card default 'btscoaudio'/'bt-sco-audio'
#     Controls      : 0
#
# Naming the card also keeps this working if the registration order ever
# changes. Bluetooth audio is unaffected: it is reached as hw:btscoaudio,
# which is what a Bluetooth audio daemon opens by name anyway.
#
# The esai* definitions at the end are kept as they come from NXP. The
# i.MX93 has no ESAI, so nothing opens them.

defaults.pcm.rate_converter "linear"

pcm.dmix_48000{
type dmix
ipc_key 5678293
ipc_key_add_uid yes
slave{
pcm "hw:wm8962audio,0"
period_time 40000
format S16_LE
rate 48000
}
}


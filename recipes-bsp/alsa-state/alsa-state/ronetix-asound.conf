pcm.asymed{
type asym
playback.pcm "dmix_48000"
capture.pcm "dsnoop_48000"
}

pcm.dsp0{
type plug
slave.pcm "asymed"
}

pcm.!default{
type plug
route_policy "average"
slave.pcm "asymed"
}

ctl.!default{
type hw
card wm8962audio
}

ctl.mixer0{
type hw
card wm8962audio
}

pcm_slave.esai{
	pcm "hw:wm8962audio,0"
	channels 8
	rate 48000
	period_time 40000
}

pcm.esaich1to6{
	type dshare
	ipc_key 5778293
	slave esai
	bindings.0 0
	bindings.1 4
	bindings.2 1
	bindings.3 5
	bindings.4 2
	bindings.5 6
}

pcm.esaich78{
	type dshare
	ipc_key 5778293
	slave esai
	bindings.0 3
	bindings.1 7
}

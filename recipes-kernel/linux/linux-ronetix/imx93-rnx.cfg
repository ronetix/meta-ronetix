# Drivers of the Ronetix RNX-iMX93-OSM and RNX-iMX93-SMARC which
# imx_v8_defconfig (KBUILD_DEFCONFIG for mx9) does not enable.
#
# Already enabled by imx_v8_defconfig and therefore not repeated here:
# PINCTRL_IMX93, DRM_FSL_LDB, DRM_PANEL_SIMPLE, PWM_IMX_TPM,
# GPIO_PCA953X, REGULATOR_PCA9450, IIO_ST_LSM6DSX, LEDS_GPIO,
# BACKLIGHT_PWM, IMX_REMOTEPROC, ETHOSU, IMX_SEC_ENCLAVE,
# SND_SOC_WM8962, SND_SOC_FSL_ASOC_CARD, SND_SOC_BT_SCO,
# VIDEO_DWC_MIPI_CSIS, VIDEO_IMX8_ISI, VIDEO_OV5640,
# PHY_FSL_IMX9_DPHY_RX.

# ETH1, the EQOS controller of the i.MX93 (the FEC driver is enabled)
CONFIG_DWMAC_DWC_QOS_ETH=y

# NOTE: the i.MX93 LCDIF is driven by DRM_IMX_LCDIFV3, which
# imx_v8_defconfig already enables. Do not add DRM_IMX_LCDIF - that is
# the older driver, it matches the same node, fails to probe with -2 and
# only adds noise to the boot log.

# PXP 2D engine (&epxp)
CONFIG_VIDEO_IMX_PXP=y

# RTC on LPI2C2
CONFIG_RTC_DRV_ISL1208=y

# No USB_HUB_USB251XB: the USB2517 is strapped for internal default
# configuration, so its SMBus slave never answers and the driver only
# produced -EIO. The hub enumerates without it.

# AP6275S (BCM43752A2) WiFi on USDHC3. The out of tree bcmdhd driver of
# the 6.1 BSP ("android,bcmdhd_wlan" in the 6.1 device tree) is not in
# this kernel, so the module runs on brcmfmac and needs
# brcm/brcmfmac43752-sdio.{bin,txt,clm_blob}, which the
# linux-firmware-bcm43752 package of meta-ronetix installs.
# Two brcmfmac fixes are needed in the kernel tree for this module, see
# the commits on the ronetix/6.18-1.0.x-imx branch:
#   - F2 SDIO blocksize 256 instead of 512 (upstream, Fixes:
#     d2587c57ffd8), against CMD53 write failures under TX load
#   - keep the last good SDPCM tx credit window instead of clamping it
#     to tx_seq + 2. brcmfmac's check trips on a window a few frames
#     behind tx_seq (the u8 distance reads as ~250), which is normal,
#     and the clamp to two credits was self sustaining under load:
#     wlan0 came up and the firmware answered control commands, but no
#     traffic flowed and scans returned nothing.
CONFIG_CORDIC=y
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y

# RFKILL, not enabled by imx_v8_defconfig. Without it wpa_supplicant
# prints "rfkill: Cannot open RFKILL control device" on every start, and
# userspace has no way to see or drive a radio kill. The SMARC and OSM
# carriers bring out W_DISABLE1#/W_DISABLE2# for exactly that purpose
# (on this module they land on the PCAL6416, see imx93-rnx-som.dtsi,
# where the usdhc3 mmc-pwrseq currently owns them).
CONFIG_RFKILL=y

# Do NOT hand every failed firmware lookup to the userspace firmware
# helper. imx_v8_defconfig enables this (mainline arm64 defconfig does
# not), and it is a trap on a systemd image: no udev has implemented the
# firmware helper for well over a decade, but
#
#   fallback_table.c: .force_sysfs_fallback =
#                         IS_ENABLED(CONFIG_FW_LOADER_USER_HELPER_FALLBACK)
#   fallback.c:       if (fw_fallback_config.force_sysfs_fallback) -> fallback
#   fallback_table.c: .loading_timeout = 60
#
# makes *every* missing firmware file - even one requested with
# firmware_request_nowarn(), and even an entirely optional one - block
# for 60 seconds waiting for a helper that will never answer. Two of
# those hit this board:
#
#   cfg80211 asks for regulatory.db at ~2.5 s, before the rootfs is
#   mounted, and only gives up at ~62 s ("failed to load regulatory.db").
#
#   brcmfmac tries the board specific brcmfmac43752-sdio.<compatible>.*
#   names before the generic ones, so one miss stalls the firmware
#   download for a minute with the chip already powered and running.
#
# Without the forced fallback a missing file fails immediately with -2,
# which is what the callers expect. The option is still reachable at
# runtime via /proc/sys/kernel/firmware_config/force_sysfs_fallback.
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set

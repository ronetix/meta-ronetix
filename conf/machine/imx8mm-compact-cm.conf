#@TYPE: Machine
#@NAME: Ronetix iMX8MM-COMPACT-CM
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for Ronetix iMX8MM-COMPACT-CM
#@MAINTAINER: Ilko Iliev <iliev@ronetix.at>
#
# http://www.ronetix.at
MACHINEOVERRIDES =. "mx8mm:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

require ronetix.inc

# Ronetix BSP default providers
PREFERRED_PROVIDER_virtual/kernel:imx8mm-compact-cm ?= "linux-ronetix"
PREFERRED_PROVIDER_u-boot:imx8mm-compact-cm ?= "u-boot-ronetix"
PREFERRED_PROVIDER_u-boot-fw-utils:imx8mm-compact-cm ?= "u-boot-fw-utils"
PREFERRED_PROVIDER_virtual/bootloader:imx8mm-compact-cm ?= "u-boot-ronetix"

LICENSE_FLAGS_ACCEPTED+="commercial"

MACHINE_EXTRA_RDEPENDS += " \
        linux-firmware-bcm4339 \
"

MACHINE_FEATURES_IMX_REMOVALS += " nxp8801-sdio nxp8987-sdio nxp8997-pcie nxp8997-sdio nxp9098-pcie nxp9098-sdio nxpiw416-sdio nxpiw612-sdio"
MACHINE_FEATURES_IMX_REMOVALS += "nxp8987 nxp8987"

KERNEL_DEVICETREE += " \
      freescale/imx8mm-compact-cm.dtb \
"

LOCALVERSION = "-imx8mm"
KBUILD_DEFCONFIG:mx8-nxp-bsp = "rnx_imx8m_defconfig"

UBOOT_DTB_NAME = "imx8mm-compact-cm.dtb"
UBOOT_SUFFIX = "bin"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx8mm_compact_cm_defconfig,sdcard"
UBOOT_MAKE_TARGET = "all"
SPL_BINARY = "spl/u-boot-spl.bin"

# Set ATF platform name
ATF_PLATFORM = "imx8mm"

IMXBOOT_TARGETS_SD   = "flash_evk"
IMXBOOT_TARGETS = "${IMXBOOT_TARGETS_SD}"

IMX_BOOT_SOC_TARGET = "iMX8MM"

LOADADDR = ""
IMX_BOOT_SEEK = "33"
OPTEE_BIN_EXT = "8mm"
TEE_LOAD_ADDR = "0xbe000000"

# Extra firmware package name, that is required to build boot container for fslc bsp
IMX_EXTRA_FIRMWARE = "firmware-imx-8m"

# We have to disable SERIAL_CONSOLE due to auto-serial-console
SERIAL_CONSOLES = "115200;ttymxc1"

# Set DDR FIRMWARE
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_imem.bin \
    lpddr4_pmu_train_1d_dmem.bin \
    lpddr4_pmu_train_2d_imem.bin \
    lpddr4_pmu_train_2d_dmem.bin \
"

MACHINE_EXTRA_RDEPENDS += " \
        iperf3 \
		alsa-utils \
		stress-ng \
		v4l-utils \
		ffmpeg \
		gstreamer1.0 \
		gstreamer1.0-plugins-good \
"

MACHINEOVERRIDES =. "mx8mm:"

KERNEL_DEVICETREE_BASENAME = "imx8mm-cm"
UBOOT_CONFIG_BASENAME = "imx8mm_cm"
ATF_PLATFORM = "imx8mm"
RONETIX_BOARD_NAME = "Ronetix i.MX8MM-CM"

require conf/machine/include/ronetix-imx8m.inc

IMX_BOOT_SEEK = "33"


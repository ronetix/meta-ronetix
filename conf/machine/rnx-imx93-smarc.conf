#@TYPE: Machine
#@NAME: Ronetix RNX-iMX93-SMARC
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for the Ronetix RNX-iMX93-SMARC SoM
#@MAINTAINER: Ilko Iliev <iliev@ronetix.at>
#
# https://www.ronetix.at

MACHINEOVERRIDES =. "mx93:"

KERNEL_DEVICETREE_BASENAME = "imx93-rnx-smarc"
# 2GB LPDDR4X. The DDR size comes from the U-Boot defconfig
# (CONFIG_IMX93_OSM_LPDDR4X_2GB), U-Boot passes it to the kernel.
# imx93-rnx_smarc_defconfig is the 1GB build of the same board.
UBOOT_CONFIG_BASENAME ?= "imx93-rnx_smarc_2gb"
ATF_PLATFORM = "imx93"
RONETIX_BOARD_NAME = "Ronetix RNX-iMX93-SMARC"

require conf/machine/include/ronetix-imx9.inc

# conf/fragments/bsp/nxp.conf of the NXP BSP distros sets
# PREFERRED_PROVIDER_virtual/kernel:mx9-nxp-bsp = "linux-imx", which is
# more specific than the IMX_DEFAULT_KERNEL default in imx-base.inc. The
# machine override wins over it.
PREFERRED_PROVIDER_virtual/kernel:rnx-imx93-smarc = "linux-ronetix"

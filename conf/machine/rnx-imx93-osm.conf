#@TYPE: Machine
#@NAME: Ronetix RNX-iMX93-OSM
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for the Ronetix RNX-iMX93-OSM SoM
#@MAINTAINER: Ilko Iliev <iliev@ronetix.at>
#
# https://www.ronetix.at

MACHINEOVERRIDES =. "mx93:"

KERNEL_DEVICETREE_BASENAME = "imx93-rnx-osm"
# 1GB LPDDR4X. The DDR size comes from the U-Boot defconfig,
# U-Boot passes it to the kernel.
UBOOT_CONFIG_BASENAME ?= "imx93-rnx_osm"
ATF_PLATFORM = "imx93"
RONETIX_BOARD_NAME = "Ronetix RNX-iMX93-OSM"

require conf/machine/include/ronetix-imx9.inc

# i.MX93 silicon revision of the SoC fitted on this SoM.
#
# The RNX-iMX93-OSM carries an A0 die, so A0 is the default here - note
# that this differs from imx-base.inc, which defaults mx93 to A1.
#
#   A0   correct for this hardware, and the default
#   A1   NOT allowed on the RNX-iMX93-OSM, do not use it
#   A2   also OK, it runs the A1 container, see ronetix-imx9.inc
#
# The ELE container inside flash.bin is revision specific:
# firmware-ele-imx deploys it under the name SECO_FIRMWARE_NAME, and
# board/ronetix/imx93-osm/imximage.cfg pulls it into flash.bin (see the
# u-boot-ronetix recipe). A flash.bin built with the container of the
# wrong revision does not boot at all - there is no fallback and no error
# message, the ROM simply stops.
#
# For an A2 module, put this in local.conf:
#
#   RONETIX_IMX93_SOC_REV = "A2"
#
# A revision with no container in the firmware-ele-imx archive fails the
# build in firmware-ele-imx:do_install, so a typo cannot slip through into
# an image that will not boot.
#
# Assigned with the mx93-generic-bsp override because that is how
# imx-base.inc sets it ("IMX_SOC_REV:mx93-generic-bsp ??= \"A1\""); a plain
# IMX_SOC_REV assignment here would lose against that override.
RONETIX_IMX93_SOC_REV ?= "A0"
IMX_SOC_REV:mx93-generic-bsp = "${RONETIX_IMX93_SOC_REV}"

# conf/fragments/bsp/nxp.conf of the NXP BSP distros sets
# PREFERRED_PROVIDER_virtual/kernel:mx9-nxp-bsp = "linux-imx", which is
# more specific than the IMX_DEFAULT_KERNEL default in imx-base.inc. The
# machine override wins over it.
PREFERRED_PROVIDER_virtual/kernel:rnx-imx93-osm = "linux-ronetix"

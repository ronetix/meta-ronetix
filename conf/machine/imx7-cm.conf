#@TYPE: Machine
#@NAME: Ronetix i.MX7-CM
#@SOC: i.MX7D
#@DESCRIPTION: Machine configuration for the Ronetix i.MX7-CM SoM
#@MAINTAINER: Ilko Iliev <iliev@ronetix.at>
#
# https://www.ronetix.at

MACHINEOVERRIDES =. "mx7:mx7d:"

require conf/machine/include/imx-base.inc
require conf/machine/include/ronetix-common.inc
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

# U-Boot and Linux kernel from github.com/ronetix
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp = "u-boot-ronetix"
IMX_DEFAULT_KERNEL:imx-mainline-bsp = "linux-ronetix"

MACHINE_FEATURES += "pci wifi bluetooth"

KERNEL_DEVICETREE = "nxp/imx/imx7-cm.dtb"

# SPL at 1 KiB, u-boot.img at 69 KiB. U-Boot boots zImage and imx7-cm.dtb
# from the boot partition with its own boot command (bootsd).
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx7_cm_defconfig"
SPL_BINARY = "SPL"
UBOOT_SUFFIX = "img"
WKS_FILE = "imx-uboot-spl-bootpart.wks.in"

SERIAL_CONSOLES = "115200;ttymxc0"

MACHINE_FIRMWARE = " \
    linux-firmware-wl18xx \
    linux-firmware-iwlwifi-6000g2a-5 \
    linux-firmware-iwlwifi-6000g2a-6 \
    linux-firmware-iwlwifi-6000g2b-5 \
    linux-firmware-iwlwifi-6000g2b-6 \
"

XSERVER += "mesa-driver-swrast"

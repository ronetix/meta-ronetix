#@TYPE: Machine
#@NAME: Ronetix i.MX8MQ-CM
#@SOC: i.MX8MQ
#@DESCRIPTION: Machine configuration for the Ronetix i.MX8MQ-CM SoM
#@MAINTAINER: Ilko Iliev <iliev@ronetix.at>
#
# https://www.ronetix.at

MACHINEOVERRIDES =. "mx8mq:"

KERNEL_DEVICETREE_BASENAME = "imx8mq-cm"
UBOOT_CONFIG_BASENAME = "imx8mq_cm"
ATF_PLATFORM = "imx8mq"
RONETIX_BOARD_NAME = "Ronetix i.MX8MQ-CM"

# without display and with the LVDS display
KERNEL_DEVICETREE = " \
    freescale/imx8mq-cm.dtb \
    freescale/imx8mq-cm-lvds.dtb \
"

# U-Boot builds flash.bin with the default make target, as on the i.MX8MQ EVK
UBOOT_MAKE_TARGET = ""

require conf/machine/include/ronetix-imx8m.inc

IMX_BOOT_SEEK = "33"

# Console on UART1
SERIAL_CONSOLES = "115200;ttymxc0"

MACHINE_SOCARCH_FILTER:append:mx8mq = " \
    virtual/libopenvg \
    virtual/libgles1 \
    virtual/libgles2 \
    virtual/egl \
    virtual/mesa \
    virtual/libgl \
    virtual/libg2d \
"

MACHINE_FIRMWARE:append = " linux-firmware-ath10k"

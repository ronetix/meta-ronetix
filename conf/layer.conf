# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ronetix-layer"
BBFILE_PATTERN_ronetix-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_ronetix-layer = "9"

LAYERSERIES_COMPAT_ronetix-layer = "wrynose"
LAYERDEPENDS_ronetix-layer = "core freescale-layer"
LAYERRECOMMENDS_ronetix-layer = "freescale-distro openembedded-layer networking-layer"

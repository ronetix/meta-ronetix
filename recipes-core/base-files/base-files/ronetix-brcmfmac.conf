# brcmfmac options for the Ronetix i.MX9 SoMs (AP6275S, BCM43752A2).
#
# Turn off the P2P (Wi-Fi Direct) feature bit. brcmfmac advertises the P2P
# interface types for this chip - brcmf_setup_wiphy() in cfg80211.c ORs
# NL80211_IFTYPE_P2P_* into wiphy->interface_modes when BRCMF_FEAT_P2P is
# set - but it cannot then create the P2P Device interface with this
# firmware, so every wpa_supplicant start waits out a ~3 s timeout and logs
#
#   ieee80211 phy0: brcmf_p2p_create_p2pdev: timeout occurred
#   ieee80211 phy0: brcmf_cfg80211_add_iface: add iface p2p-dev-wlan0
#       type 10 failed: err=-5
#   nl80211: Failed to create a P2P Device interface p2p-dev-wlan0
#
# With the bit cleared P2P is never offered, so nothing tries to create the
# interface. Station mode and AP mode are unaffected.
#
# 0x10 is BIT(BRCMF_FEAT_P2P): P2P is the fifth entry of BRCMF_FEAT_LIST in
# brcmfmac/feature.h (MBSS, MCHAN, PNO, WOWL, P2P), so its id is 4, and
# brcmf_feat_is_enabled() tests "feat_flags & BIT(id)". feature.c applies
# the parameter as "feat_flags &= ~feature_disable".
#
# Note this is a brcmfmac limitation, not a firmware one: the out of tree
# bcmdhd driver of the 6.1 BSP brings P2P up on the very same module and
# firmware. Delete this file if Wi-Fi Direct is ever required.
options brcmfmac feature_disable=0x10

# Default ALSA device for the Ronetix i.MX9 SoMs.
#
# These boards register two sound cards: the WM8962 codec and the
# Bluetooth SCO link of the AP6275S (sound-bt-sco in the device tree, a
# PCM to the Bluetooth controller with no mixer at all). ALSA numbers
# cards in registration order, and the bt-sco card comes up first:
#
#   0 [btscoaudio ]: simple-card   - bt-sco-audio
#   1 [wm8962audio]: fsl-asoc-card - wm8962-audio
#
# So the built in "default" device, which is card 0, is the Bluetooth
# link. Anything that just opens "default" - aplay without -D, amixer
# without -c, most applications - talks to a card with no outputs and no
# controls:
#
#   $ amixer info
#   Card default 'btscoaudio'/'bt-sco-audio'
#     Controls      : 0
#
# Point the default at the codec instead. Note that overriding
# defaults.pcm.card / defaults.ctl.card does not work, with or without
# the override "!": the default device has to be redefined outright.
#
# The cards are named rather than numbered, so this keeps working if the
# registration order ever changes. "plug" is used for the PCM so that the
# sample rate and format are converted when the codec cannot take them
# directly.
#
# Bluetooth audio is unaffected: it is reached as hw:btscoaudio, which is
# what a Bluetooth audio daemon opens by name anyway.
ctl.!default {
    type hw
    card wm8962audio
}

pcm.!default {
    type plug
    slave.pcm "hw:wm8962audio,0"
}
